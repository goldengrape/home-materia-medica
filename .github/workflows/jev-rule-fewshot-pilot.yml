name: Jev TCM Rule Few-shot Pilot

on:
  push:
    branches:
      - feat/jev-rule-fewshot-pilot
    paths:
      - "experiments/jev-rule-fewshot-pilot/**"
      - ".github/workflows/jev-rule-fewshot-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    environment: API_KEYS

    steps:
      - uses: actions/checkout@v4

      - name: Verify API secret
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JEV_API_KEY:-}" || {
            echo "::error::JEV_API_KEY is unavailable."
            exit 1
          }
          echo "JEV_API_KEY is available (value hidden)."

      - name: Run 5-herb v0.3.1 narrative pilot
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          JEV_MODEL: jev-latest
          JEV_REPEATS: "3"
        run: python experiments/jev-rule-fewshot-pilot/run_pilot_v031.py

      - name: Upload pilot results
        uses: actions/upload-artifact@v4
        with:
          name: jev-rule-fewshot-results-v0.3.1
          path: experiments/jev-rule-fewshot-pilot/results-v0.3.1.json
          if-no-files-found: error
          retention-days: 30
